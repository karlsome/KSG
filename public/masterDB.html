<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master DB - KSG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
    <!-- Universal Fonts & Admin Theme -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin-theme.css">
    <style>
        .tab-active {
            background-color: rgb(243 244 246) !important;
            color: rgb(17 24 39) !important;
            font-weight: 600 !important;
            box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05) !important;
        }
        .tag {
            display: inline-flex;
            align-items: center;
            padding: 0.125rem 0.5rem;
            margin: 0.125rem;
            background-color: rgb(243 244 246);
            color: rgb(55 65 81);
            border: 1px solid rgb(229 231 235);
            border-radius: 0.5rem;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .tag-remove {
            margin-left: 0.25rem;
            cursor: pointer;
            color: rgb(156 163 175);
        }
        .tag-remove:hover {
            color: rgb(239 68 68);
        }
    </style>
</head>
<body class="bg-gray-50 font-sans antialiased text-gray-900">
    <div class="container mx-auto px-4 py-6">
        <!-- Header with Title and Action Buttons -->
        <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between mb-5">
            <div>
                <h2 class="text-2xl font-semibold tracking-tight text-gray-900" data-i18n="masterDB.title">マスターDB</h2>
                <p class="mt-0.5 text-xs text-gray-500">マスタデータの管理・設備・不良グループ・ロールなどの統合設定</p>
            </div>
            <div class="flex flex-wrap items-center gap-2">
                <button class="inline-flex items-center gap-1.5 rounded-xl border border-gray-200 bg-white px-3.5 py-1.5 text-xs font-semibold text-gray-700 shadow-2xs transition hover:bg-gray-50 hover:text-gray-900 cursor-pointer" onclick="showCSVUploadModal()">
                    <i class="ri-file-upload-line text-sm text-indigo-600"></i><span data-i18n="masterDB.csvBulkRegister">CSV一括登録</span>
                </button>
                <button class="inline-flex items-center gap-1.5 rounded-xl bg-emerald-600 px-3.5 py-1.5 text-xs font-semibold text-white shadow-2xs transition hover:bg-emerald-700 cursor-pointer" onclick="showQuickCreateModal()">
                    <i class="ri-add-line text-sm"></i><span data-i18n="masterDB.newRegistration">新規登録</span>
                </button>
            </div>
        </div>

        <!-- Main Tabs -->
        <div class="bg-white rounded-2xl shadow-xs border border-gray-100 mb-5 overflow-hidden">
            <div class="flex items-center gap-1 overflow-x-auto border-b border-gray-100 px-4 pt-2.5 pb-2 scrollbar-none" id="masterMainTabsBar">
                <button id="tabMaster" class="inline-flex items-center gap-1.5 rounded-xl px-3.5 py-2 text-xs font-semibold transition whitespace-nowrap cursor-pointer bg-gray-100 text-gray-900 shadow-xs tab-active" onclick="switchMainTab('master')">
                    <i class="ri-database-2-line"></i><span data-i18n="masterDB.tabMaster">マスター</span>
                </button>
                <button id="tabMasterNG" class="inline-flex items-center gap-1.5 rounded-xl px-3.5 py-2 text-xs font-medium transition whitespace-nowrap cursor-pointer text-gray-500 hover:text-gray-900 hover:bg-gray-50" onclick="switchMainTab('masterNG')">
                    <i class="ri-alert-line"></i><span data-i18n="masterDB.tabMasterNG">不良グループ</span>
                </button>
                <button id="tabTrouble" class="inline-flex items-center gap-1.5 rounded-xl px-3.5 py-2 text-xs font-medium transition whitespace-nowrap cursor-pointer text-gray-500 hover:text-gray-900 hover:bg-gray-50" onclick="switchMainTab('trouble')">
                    <i class="ri-error-warning-line"></i><span data-i18n="masterDB.tabTrouble">トラブル</span>
                </button>
                <button id="tabFactory" class="inline-flex items-center gap-1.5 rounded-xl px-3.5 py-2 text-xs font-medium transition whitespace-nowrap cursor-pointer text-gray-500 hover:text-gray-900 hover:bg-gray-50" onclick="switchMainTab('factory')">
                    <i class="ri-building-line"></i><span data-i18n="masterDB.tabFactory">工場</span>
                </button>
                <button id="tabEquipment" class="inline-flex items-center gap-1.5 rounded-xl px-3.5 py-2 text-xs font-medium transition whitespace-nowrap cursor-pointer text-gray-500 hover:text-gray-900 hover:bg-gray-50" onclick="switchMainTab('equipment')">
                    <i class="ri-tools-line"></i><span data-i18n="masterDB.tabEquipment">設備</span>
                </button>
                <button id="tabRoles" class="inline-flex items-center gap-1.5 rounded-xl px-3.5 py-2 text-xs font-medium transition whitespace-nowrap cursor-pointer text-gray-500 hover:text-gray-900 hover:bg-gray-50" onclick="switchMainTab('roles')">
                    <i class="ri-shield-user-line"></i><span data-i18n="masterDB.tabRoles">ロール</span>
                </button>
                <button id="tabDepartment" class="inline-flex items-center gap-1.5 rounded-xl px-3.5 py-2 text-xs font-medium transition whitespace-nowrap cursor-pointer text-gray-500 hover:text-gray-900 hover:bg-gray-50" onclick="switchMainTab('department')">
                    <i class="ri-building-2-line"></i><span data-i18n="masterDB.tabDepartment">所属部署</span>
                </button>
                <button id="tabSection" class="inline-flex items-center gap-1.5 rounded-xl px-3.5 py-2 text-xs font-medium transition whitespace-nowrap cursor-pointer text-gray-500 hover:text-gray-900 hover:bg-gray-50" onclick="switchMainTab('section')">
                    <i class="ri-group-line"></i><span data-i18n="masterDB.tabSection">所属係</span>
                </button>
                <button id="tabRpiServer" class="inline-flex items-center gap-1.5 rounded-xl px-3.5 py-2 text-xs font-medium transition whitespace-nowrap cursor-pointer text-gray-500 hover:text-gray-900 hover:bg-gray-50" onclick="switchMainTab('rpiServer')">
                    <i class="ri-server-line"></i><span data-i18n="masterDB.tabRpiServer">Rpiサーバー</span>
                </button>
                <button id="tabTablet" class="inline-flex items-center gap-1.5 rounded-xl px-3.5 py-2 text-xs font-medium transition whitespace-nowrap cursor-pointer text-gray-500 hover:text-gray-900 hover:bg-gray-50" onclick="switchMainTab('tablet')">
                    <i class="ri-tablet-line"></i><span data-i18n="masterDB.tabTablet">タブレット</span>
                </button>
                <button id="tabGoogleSheets" class="inline-flex items-center gap-1.5 rounded-xl px-3.5 py-2 text-xs font-medium transition whitespace-nowrap cursor-pointer text-gray-500 hover:text-gray-900 hover:bg-gray-50" onclick="switchMainTab('googleSheets')">
                    <i class="ri-file-excel-2-line"></i><span data-i18n="masterDB.tabGoogleSheets">Google Sheets</span>
                </button>
                <button id="tabOpcua" class="inline-flex items-center gap-1.5 rounded-xl px-3.5 py-2 text-xs font-medium transition whitespace-nowrap cursor-pointer text-gray-500 hover:text-gray-900 hover:bg-gray-50" onclick="switchMainTab('opcua')">
                    <i class="ri-node-tree"></i><span data-i18n="masterDB.tabOpcua">OPC UA</span>
                </button>
            </div>

            <!-- Master Tab Content -->
            <div id="contentMaster" class="p-6">
                <div class="inline-flex rounded-xl border border-gray-200 bg-gray-50 p-1 shadow-2xs mb-5">
                    <button id="masterSubTabData" class="inline-flex items-center gap-2 rounded-lg px-3.5 py-1.5 text-xs font-semibold bg-white text-gray-900 shadow-2xs transition cursor-pointer" onclick="switchSubTab('master', 'data')">
                        <i class="ri-table-line"></i><span data-i18n="masterDB.dataList">データ一覧</span>
                    </button>
                    <button id="masterSubTabHistory" class="inline-flex items-center gap-2 rounded-lg px-3.5 py-1.5 text-xs font-medium text-gray-500 hover:text-gray-900 transition cursor-pointer" onclick="switchSubTab('master', 'history')">
                        <i class="ri-history-line"></i><span data-i18n="masterDB.createDeleteHistory">作成・削除履歴</span>
                    </button>
                </div>
                <div id="masterDataContent">
                    <div id="masterTableContainer">
                        <p class="text-gray-500" data-i18n="common.loading"></p>
                    </div>
                </div>
                <div id="masterHistoryContent" class="hidden">
                    <div id="masterHistoryContainer">
                        <p class="text-gray-500" data-i18n="common.loadingHistory"></p>
                    </div>
                </div>
            </div>

            <!-- Master NG Tab Content -->
            <div id="contentMasterNG" class="p-6 hidden">
                <div id="masterNGTableContainer">
                    <p class="text-gray-500">読み込み中...</p>
                </div>
            </div>

            <!-- Trouble Tab Content -->
            <div id="contentTrouble" class="p-6 hidden">
                <div id="troubleTableContainer">
                    <p class="text-gray-500" data-i18n="common.loading">読み込み中...</p>
                </div>
            </div>

            <!-- Factory Tab Content -->
            <div id="contentFactory" class="p-6 hidden">
                <div class="inline-flex rounded-xl border border-gray-200 bg-gray-50 p-1 shadow-2xs mb-5">
                    <button id="factorySubTabData" class="inline-flex items-center gap-2 rounded-lg px-3.5 py-1.5 text-xs font-semibold bg-white text-gray-900 shadow-2xs transition cursor-pointer" onclick="switchSubTab('factory', 'data')">
                        <i class="ri-table-line"></i><span data-i18n="masterDB.dataList">データ一覧</span>
                    </button>
                    <button id="factorySubTabHistory" class="inline-flex items-center gap-2 rounded-lg px-3.5 py-1.5 text-xs font-medium text-gray-500 hover:text-gray-900 transition cursor-pointer" onclick="switchSubTab('factory', 'history')">
                        <i class="ri-history-line"></i><span data-i18n="masterDB.createDeleteHistory">作成・削除履歴</span>
                    </button>
                </div>
                <div id="factoryDataContent">
                    <div id="factoryTableContainer">
                        <p class="text-gray-500" data-i18n="common.loading"></p>
                    </div>
                </div>
                <div id="factoryHistoryContent" class="hidden">
                    <div id="factoryHistoryContainer">
                        <p class="text-gray-500" data-i18n="common.loadingHistory"></p>
                    </div>
                </div>
            </div>

            <!-- Equipment Tab Content -->
            <div id="contentEquipment" class="p-6 hidden">
                <div class="inline-flex rounded-xl border border-gray-200 bg-gray-50 p-1 shadow-2xs mb-5">
                    <button id="equipmentSubTabData" class="inline-flex items-center gap-2 rounded-lg px-3.5 py-1.5 text-xs font-semibold bg-white text-gray-900 shadow-2xs transition cursor-pointer" onclick="switchSubTab('equipment', 'data')">
                        <i class="ri-table-line"></i><span data-i18n="masterDB.dataList">データ一覧</span>
                    </button>
                    <button id="equipmentSubTabHistory" class="inline-flex items-center gap-2 rounded-lg px-3.5 py-1.5 text-xs font-medium text-gray-500 hover:text-gray-900 transition cursor-pointer" onclick="switchSubTab('equipment', 'history')">
                        <i class="ri-history-line"></i><span data-i18n="masterDB.createDeleteHistory">作成・削除履歴</span>
                    </button>
                </div>
                <div id="equipmentDataContent">
                    <div id="equipmentTableContainer">
                        <p class="text-gray-500" data-i18n="common.loading"></p>
                    </div>
                </div>
                <div id="equipmentHistoryContent" class="hidden">
                    <div id="equipmentHistoryContainer">
                        <p class="text-gray-500" data-i18n="common.loadingHistory"></p>
                    </div>
                </div>
            </div>

            <!-- Roles Tab Content -->
            <div id="contentRoles" class="p-6 hidden">
                <div class="inline-flex rounded-xl border border-gray-200 bg-gray-50 p-1 shadow-2xs mb-5">
                    <button id="rolesSubTabData" class="inline-flex items-center gap-2 rounded-lg px-3.5 py-1.5 text-xs font-semibold bg-white text-gray-900 shadow-2xs transition cursor-pointer" onclick="switchSubTab('roles', 'data')">
                        <i class="ri-table-line"></i><span data-i18n="masterDB.dataList">データ一覧</span>
                    </button>
                    <button id="rolesSubTabHistory" class="inline-flex items-center gap-2 rounded-lg px-3.5 py-1.5 text-xs font-medium text-gray-500 hover:text-gray-900 transition cursor-pointer" onclick="switchSubTab('roles', 'history')">
                        <i class="ri-history-line"></i><span data-i18n="masterDB.createDeleteHistory">作成・削除履歴</span>
                    </button>
                </div>
                <div id="rolesDataContent">
                    <div id="rolesTableContainer">
                        <p class="text-gray-500" data-i18n="common.loading"></p>
                    </div>
                </div>
                <div id="rolesHistoryContent" class="hidden">
                    <div id="rolesHistoryContainer">
                        <p class="text-gray-500" data-i18n="common.loadingHistory"></p>
                    </div>
                </div>
            </div>

            <!-- Department Tab Content -->
            <div id="contentDepartment" class="p-6 hidden">
                <div class="inline-flex rounded-xl border border-gray-200 bg-gray-50 p-1 shadow-2xs mb-5">
                    <button id="departmentSubTabData" class="inline-flex items-center gap-2 rounded-lg px-3.5 py-1.5 text-xs font-semibold bg-white text-gray-900 shadow-2xs transition cursor-pointer" onclick="switchSubTab('department', 'data')">
                        <i class="ri-table-line"></i><span data-i18n="masterDB.dataList">データ一覧</span>
                    </button>
                    <button id="departmentSubTabHistory" class="inline-flex items-center gap-2 rounded-lg px-3.5 py-1.5 text-xs font-medium text-gray-500 hover:text-gray-900 transition cursor-pointer" onclick="switchSubTab('department', 'history')">
                        <i class="ri-history-line"></i><span data-i18n="masterDB.createDeleteHistory">作成・削除履歴</span>
                    </button>
                </div>
                <div id="departmentDataContent">
                    <div id="departmentTableContainer">
                        <p class="text-gray-500" data-i18n="common.loading"></p>
                    </div>
                </div>
                <div id="departmentHistoryContent" class="hidden">
                    <div id="departmentHistoryContainer">
                        <p class="text-gray-500" data-i18n="common.loadingHistory"></p>
                    </div>
                </div>
            </div>

            <!-- Section Tab Content -->
            <div id="contentSection" class="p-6 hidden">
                <div class="inline-flex rounded-xl border border-gray-200 bg-gray-50 p-1 shadow-2xs mb-5">
                    <button id="sectionSubTabData" class="inline-flex items-center gap-2 rounded-lg px-3.5 py-1.5 text-xs font-semibold bg-white text-gray-900 shadow-2xs transition cursor-pointer" onclick="switchSubTab('section', 'data')">
                        <i class="ri-table-line"></i><span data-i18n="masterDB.dataList">データ一覧</span>
                    </button>
                    <button id="sectionSubTabHistory" class="inline-flex items-center gap-2 rounded-lg px-3.5 py-1.5 text-xs font-medium text-gray-500 hover:text-gray-900 transition cursor-pointer" onclick="switchSubTab('section', 'history')">
                        <i class="ri-history-line"></i><span data-i18n="masterDB.createDeleteHistory">作成・削除履歴</span>
                    </button>
                </div>
                <div id="sectionDataContent">
                    <div id="sectionTableContainer">
                        <p class="text-gray-500" data-i18n="common.loading"></p>
                    </div>
                </div>
                <div id="sectionHistoryContent" class="hidden">
                    <div id="sectionHistoryContainer">
                        <p class="text-gray-500" data-i18n="common.loadingHistory"></p>
                    </div>
                </div>
            </div>

            <!-- Rpi Server Tab Content -->
            <div id="contentRpiServer" class="p-6 hidden">
                <div class="inline-flex rounded-xl border border-gray-200 bg-gray-50 p-1 shadow-2xs mb-5">
                    <button id="rpiServerSubTabData" class="inline-flex items-center gap-2 rounded-lg px-3.5 py-1.5 text-xs font-semibold bg-white text-gray-900 shadow-2xs transition cursor-pointer" onclick="switchSubTab('rpiServer', 'data')">
                        <i class="ri-server-line"></i><span data-i18n="masterDB.deviceList">機器一覧</span>
                    </button>
                </div>
                <div id="rpiServerDataContent">
                    <div id="rpiServerTableContainer">
                        <p class="text-gray-500" data-i18n="masterDB.loadingDevices"></p>
                    </div>
                </div>
            </div>

            <!-- Tablet Tab Content -->
            <div id="contentTablet" class="p-6 hidden">
                <div class="inline-flex rounded-xl border border-gray-200 bg-gray-50 p-1 shadow-2xs mb-5">
                    <button id="tabletSubTabData" class="inline-flex items-center gap-2 rounded-lg px-3.5 py-1.5 text-xs font-semibold bg-white text-gray-900 shadow-2xs transition cursor-pointer" onclick="switchSubTab('tablet', 'data')">
                        <i class="ri-tablet-line"></i><span data-i18n="masterDB.tabletList">端末一覧</span>
                    </button>
                    <button id="tabletSubTabHistory" class="inline-flex items-center gap-2 rounded-lg px-3.5 py-1.5 text-xs font-medium text-gray-500 hover:text-gray-900 transition cursor-pointer" onclick="switchSubTab('tablet', 'history')">
                        <i class="ri-history-line"></i><span data-i18n="masterDB.createDeleteHistory">作成・削除履歴</span>
                    </button>
                </div>
                <div id="tabletDataContent">
                    <div id="tabletTableContainer">
                        <p class="text-gray-500" data-i18n="masterDB.loadingTablets"></p>
                    </div>
                </div>
                <div id="tabletHistoryContent" class="hidden">
                    <div id="tabletHistoryContainer">
                        <p class="text-gray-500" data-i18n="common.loadingHistory"></p>
                    </div>
                </div>
            </div>

            <div id="contentGoogleSheets" class="p-6 hidden">
                <div id="googleSheetsTargetContainer">
                    <p class="text-gray-500" data-i18n="common.loading"></p>
                </div>
            </div>

            <div id="contentOpcua" class="p-6 hidden">
                <div class="inline-flex rounded-xl border border-gray-200 bg-gray-50 p-1 shadow-2xs mb-5">
                    <button id="opcuaSubTabData" class="inline-flex items-center gap-2 rounded-lg px-3.5 py-1.5 text-xs font-semibold bg-white text-gray-900 shadow-2xs transition cursor-pointer" onclick="switchSubTab('opcua', 'data')">
                        <i class="ri-table-line"></i><span>Devices</span>
                    </button>
                    <button id="opcuaSubTabHistory" class="inline-flex items-center gap-2 rounded-lg px-3.5 py-1.5 text-xs font-medium text-gray-500 hover:text-gray-900 transition cursor-pointer" onclick="switchSubTab('opcua', 'history')">
                        <i class="ri-history-line"></i><span data-i18n="masterDB.createDeleteHistory">作成・削除履歴</span>
                    </button>
                </div>
                <div id="opcuaDataContent">
                    <div id="opcuaTableContainer">
                        <p class="text-gray-500" data-i18n="common.loading"></p>
                    </div>
                </div>
                <div id="opcuaHistoryContent" class="hidden">
                    <div id="opcuaHistoryContainer">
                        <p class="text-gray-500" data-i18n="common.loadingHistory"></p>
                    </div>
                </div>
            </div>

        </div>

        <!-- Detail Modal -->
        <div id="detailModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl border border-gray-100 max-w-3xl w-full max-h-[90vh] flex flex-col overflow-hidden">
                <div class="flex items-center justify-between px-6 py-3.5 border-b border-gray-100 flex-shrink-0">
                    <h2 id="modalTitle" class="text-base font-semibold tracking-tight text-gray-900"></h2>
                    <button onclick="closeDetailModal()" class="flex h-7 w-7 items-center justify-center rounded-lg text-gray-400 hover:bg-gray-100 hover:text-gray-700 transition cursor-pointer">
                        <i class="ri-close-line text-lg"></i>
                    </button>
                </div>

                <!-- Modal Sub Tabs -->
                <div class="inline-flex rounded-xl border border-gray-200 bg-gray-50 p-1 shadow-2xs mx-6 mt-3.5 flex-shrink-0 w-fit">
                    <button id="modalTabDetails" class="inline-flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-xs font-semibold bg-white text-gray-900 shadow-2xs transition cursor-pointer" onclick="switchModalTab('details')">
                        <i class="ri-information-line"></i><span data-i18n="masterDB.details">詳細</span>
                    </button>
                    <button id="modalTabHistory" class="inline-flex items-center gap-1.5 rounded-lg px-3 py-1.5 text-xs font-medium text-gray-500 hover:text-gray-900 transition cursor-pointer" onclick="switchModalTab('history')">
                        <i class="ri-history-line"></i><span data-i18n="masterDB.changeHistory">変更履歴</span>
                    </button>
                </div>

                <div class="overflow-y-auto flex-1">
                    <div id="modalDetailsContent" class="p-6">
                        <div id="modalDetailsBody"></div>
                    </div>
                    <div id="modalHistoryContent" class="p-6 hidden">
                        <div id="modalHistoryBody"></div>
                    </div>
                </div>

                <div class="flex justify-end gap-2 px-6 py-3 border-t border-gray-100 bg-gray-50/50 flex-shrink-0">
                    <button id="modalEditBtn" onclick="toggleEditMode()" class="inline-flex items-center gap-1.5 rounded-xl bg-indigo-600 px-3.5 py-1.5 text-xs font-semibold text-white shadow-2xs transition hover:bg-indigo-700 cursor-pointer">
                        <i class="ri-edit-line"></i><span data-i18n="common.edit">編集</span>
                    </button>
                    <button id="modalSaveBtn" onclick="saveModalChanges()" class="inline-flex items-center gap-1.5 rounded-xl bg-emerald-600 px-3.5 py-1.5 text-xs font-semibold text-white shadow-2xs transition hover:bg-emerald-700 hidden cursor-pointer">
                        <i class="ri-save-line"></i><span data-i18n="common.save">保存</span>
                    </button>
                    <button id="modalCancelBtn" onclick="cancelEditMode()" class="inline-flex items-center gap-1.5 rounded-xl border border-gray-200 bg-white px-3.5 py-1.5 text-xs font-medium text-gray-700 shadow-2xs transition hover:bg-gray-50 hidden cursor-pointer">
                        <span data-i18n="common.cancel">キャンセル</span>
                    </button>
                    <button onclick="closeDetailModal()" class="inline-flex items-center gap-1.5 rounded-xl border border-gray-200 bg-white px-3.5 py-1.5 text-xs font-medium text-gray-700 shadow-2xs transition hover:bg-gray-50 cursor-pointer">
                        <span data-i18n="common.close">閉じる</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Delete Confirmation Modal -->
        <div id="deleteConfirmModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl border border-gray-100 max-w-md w-full overflow-hidden">
                <div class="px-6 py-3.5 border-b border-gray-100">
                    <h3 class="text-base font-semibold text-rose-600 flex items-center gap-2">
                        <i class="ri-alert-line text-lg"></i><span data-i18n="masterDB.deleteConfirmation">削除確認</span>
                    </h3>
                </div>
                <div class="p-6">
                    <p class="mb-4 text-xs text-gray-600" data-i18n="masterDB.deleteConfirmMsg"></p>
                    <div id="deleteItemsList" class="bg-gray-50 p-3 rounded-xl max-h-60 overflow-y-auto text-xs"></div>
                </div>
                <div class="flex justify-end gap-2 px-6 py-3 border-t border-gray-100 bg-gray-50/50">
                    <button onclick="closeDeleteConfirmModal()" class="rounded-xl border border-gray-200 bg-white px-3.5 py-1.5 text-xs font-medium text-gray-700 shadow-2xs hover:bg-gray-50 transition cursor-pointer">
                        <span data-i18n="common.cancel">キャンセル</span>
                    </button>
                    <button onclick="confirmDelete()" class="inline-flex items-center gap-1.5 rounded-xl bg-rose-600 px-3.5 py-1.5 text-xs font-semibold text-white shadow-2xs hover:bg-rose-700 transition cursor-pointer">
                        <i class="ri-delete-bin-line"></i><span data-i18n="common.delete">削除</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- CSV Upload Modal -->
        <div id="csvUploadModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl border border-gray-100 max-w-2xl w-full overflow-hidden">
                <div class="px-6 py-3.5 border-b border-gray-100">
                    <h3 class="text-base font-semibold text-gray-900 flex items-center gap-2">
                        <i class="ri-file-upload-line text-indigo-600 text-lg"></i><span data-i18n="masterDB.csvUploadTitle">CSV一括登録</span>
                    </h3>
                </div>
                <div class="p-6">
                    <p class="mb-4 text-xs text-gray-500" data-i18n="masterDB.csvDescription"></p>
                    <div class="border-2 border-dashed border-gray-200 rounded-2xl p-6 text-center hover:border-indigo-400 transition bg-gray-50/50">
                        <i class="ri-file-upload-line text-3xl text-gray-400 mb-2 block"></i>
                        <p class="text-xs font-medium text-gray-700 mb-1" data-i18n="masterDB.dragAndDrop"></p>
                        <p class="text-2xs text-gray-400 mb-3" data-i18n="common.or"></p>
                        <label class="inline-flex items-center gap-1.5 px-3.5 py-1.5 bg-indigo-600 text-white text-xs font-semibold rounded-xl hover:bg-indigo-700 cursor-pointer shadow-2xs transition">
                            <i class="ri-folder-open-line"></i><span data-i18n="masterDB.selectFile">ファイルを選択</span>
                            <input type="file" id="csvFileInput" accept=".csv" class="hidden" onchange="handleCSVUpload(event)">
                        </label>
                    </div>
                    <div id="csvPreview" class="mt-4 hidden">
                        <h4 class="text-xs font-semibold text-gray-700 mb-2" data-i18n="common.preview">プレビュー</h4>
                        <div class="bg-gray-50 p-3 rounded-xl max-h-60 overflow-auto border border-gray-100">
                            <table class="w-full text-xs" id="csvPreviewTable"></table>
                        </div>
                    </div>
                </div>
                <div class="flex justify-end gap-2 px-6 py-3 border-t border-gray-100 bg-gray-50/50">
                    <button onclick="closeCSVUploadModal()" class="rounded-xl border border-gray-200 bg-white px-3.5 py-1.5 text-xs font-medium text-gray-700 shadow-2xs hover:bg-gray-50 transition cursor-pointer">
                        <span data-i18n="common.cancel">キャンセル</span>
                    </button>
                    <button id="csvUploadBtn" onclick="uploadCSVData()" class="inline-flex items-center gap-1.5 rounded-xl bg-indigo-600 px-3.5 py-1.5 text-xs font-semibold text-white shadow-2xs hover:bg-indigo-700 hidden cursor-pointer">
                        <i class="ri-upload-line"></i><span data-i18n="common.upload">アップロード</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- NG Group Edit Modal -->
        <div id="ngGroupModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl border border-gray-100 w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden">
                <div class="flex items-center justify-between px-6 py-3.5 border-b border-gray-100 flex-shrink-0">
                    <h2 id="ngGroupModalTitle" class="text-base font-semibold tracking-tight text-gray-900">不良グループ</h2>
                    <button onclick="closeNGGroupModal()" class="flex h-7 w-7 items-center justify-center rounded-lg text-gray-400 hover:bg-gray-100 hover:text-gray-700 transition cursor-pointer">
                        <i class="ri-close-line text-lg"></i>
                    </button>
                </div>
                <div class="overflow-y-auto flex-1 p-6">
                    <div class="mb-4">
                        <label class="block text-xs font-semibold text-gray-700 mb-1">グループ名 <span class="text-rose-500">*</span></label>
                        <input type="text" id="ngGroupName" class="w-full rounded-xl border border-gray-200 bg-white px-3 py-1.5 text-xs text-gray-700 placeholder:text-gray-400 shadow-2xs focus:border-indigo-500 focus:outline-none" placeholder="例: 品番Aグループ" />
                    </div>
                    <div>
                        <div class="flex items-center justify-between mb-2.5">
                            <label class="block text-xs font-semibold text-gray-700">不良項目</label>
                            <button onclick="addNGItemRow()" class="inline-flex items-center gap-1 px-2.5 py-1 bg-indigo-50 text-indigo-700 rounded-lg hover:bg-indigo-100 text-xs font-semibold cursor-pointer transition">
                                <i class="ri-add-line"></i>項目追加
                            </button>
                        </div>
                        <!-- Preset color palette -->
                        <div class="mb-3 p-3 bg-gray-50 rounded-xl border border-gray-100">
                            <p class="text-xs text-gray-400 font-medium mb-2">カラープリセット（クリックして選択）:</p>
                            <div class="flex flex-wrap gap-2" id="colorPalette">
                                <span class="ng-preset-color w-5 h-5 rounded-full cursor-pointer border-2 border-white shadow-2xs" style="background:#f44336" data-color="#f44336" title="赤"></span>
                                <span class="ng-preset-color w-5 h-5 rounded-full cursor-pointer border-2 border-white shadow-2xs" style="background:#ff9800" data-color="#ff9800" title="オレンジ"></span>
                                <span class="ng-preset-color w-5 h-5 rounded-full cursor-pointer border-2 border-white shadow-2xs" style="background:#ffc107" data-color="#ffc107" title="黄色"></span>
                                <span class="ng-preset-color w-5 h-5 rounded-full cursor-pointer border-2 border-white shadow-2xs" style="background:#4caf50" data-color="#4caf50" title="緑"></span>
                                <span class="ng-preset-color w-5 h-5 rounded-full cursor-pointer border-2 border-white shadow-2xs" style="background:#2196f3" data-color="#2196f3" title="青"></span>
                                <span class="ng-preset-color w-5 h-5 rounded-full cursor-pointer border-2 border-white shadow-2xs" style="background:#9c27b0" data-color="#9c27b0" title="紫"></span>
                                <span class="ng-preset-color w-5 h-5 rounded-full cursor-pointer border-2 border-white shadow-2xs" style="background:#e91e63" data-color="#e91e63" title="ピンク"></span>
                                <span class="ng-preset-color w-5 h-5 rounded-full cursor-pointer border-2 border-white shadow-2xs" style="background:#009688" data-color="#009688" title="ティール"></span>
                                <span class="ng-preset-color w-5 h-5 rounded-full cursor-pointer border-2 border-white shadow-2xs" style="background:#607d8b" data-color="#607d8b" title="グレー"></span>
                                <span class="ng-preset-color w-5 h-5 rounded-full cursor-pointer border-2 border-white shadow-2xs" style="background:#795548" data-color="#795548" title="ブラウン"></span>
                            </div>
                        </div>
                        <div id="ngItemsList" class="space-y-2">
                            <!-- rows injected by JS -->
                        </div>
                        <p id="ngItemsEmpty" class="text-gray-400 text-xs text-center py-4">「項目追加」ボタンで不良項目を追加してください</p>
                    </div>
                </div>
                <div class="flex justify-end gap-2 px-6 py-3 border-t border-gray-100 bg-gray-50/50 flex-shrink-0">
                    <button onclick="closeNGGroupModal()" class="rounded-xl border border-gray-200 bg-white px-3.5 py-1.5 text-xs font-medium text-gray-700 shadow-2xs hover:bg-gray-50 transition cursor-pointer">キャンセル</button>
                    <button onclick="saveNGGroup()" class="inline-flex items-center gap-1.5 rounded-xl bg-emerald-600 px-3.5 py-1.5 text-xs font-semibold text-white shadow-2xs hover:bg-emerald-700 transition cursor-pointer">
                        <i class="ri-save-line"></i>保存
                    </button>
                </div>
            </div>
        </div>

        <!-- Trouble Group Modal -->
        <div id="troubleGroupModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl border border-gray-100 w-full max-w-2xl max-h-[90vh] flex flex-col overflow-hidden">
                <div class="flex items-center justify-between px-6 py-3.5 border-b border-gray-100 flex-shrink-0">
                    <h2 id="troubleGroupModalTitle" class="text-base font-semibold tracking-tight text-gray-900">トラブルグループ</h2>
                    <button onclick="closeTroubleGroupModal()" class="flex h-7 w-7 items-center justify-center rounded-lg text-gray-400 hover:bg-gray-100 hover:text-gray-700 transition cursor-pointer" data-i18n-title="common.close" title="閉じる">
                        <i class="ri-close-line text-lg"></i>
                    </button>
                </div>
                <div class="overflow-y-auto flex-1 p-6 space-y-5">
                    <!-- Group Name -->
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1"><span data-i18n="masterDB.troubleGroupNameLabel">グループ名</span> <span class="text-rose-500">*</span></label>
                        <input type="text" id="troubleGroupName" class="w-full rounded-xl border border-gray-200 bg-white px-3 py-1.5 text-xs text-gray-700 placeholder:text-gray-400 shadow-2xs focus:border-indigo-500 focus:outline-none" data-i18n-placeholder="masterDB.troubleGroupNamePlaceholder" placeholder="例: 第1ライン トラブルグループ" />
                    </div>

                    <!-- Trouble Items List -->
                    <div>
                        <div class="flex items-center justify-between mb-2">
                            <div>
                                <label class="block text-xs font-semibold text-gray-700" data-i18n="masterDB.troubleItemsTitle">トラブル項目一覧</label>
                                <p class="text-xs text-gray-400" data-i18n="masterDB.troubleItemsSubtitle">タブレットの「機械トラブル」ボタン押下時に表示される選択肢です</p>
                            </div>
                        </div>
                        <div id="troubleItemsList" class="space-y-2 mb-2.5">
                            <!-- rows injected by JS -->
                        </div>
                        <p id="troubleItemsEmpty" class="text-gray-400 text-xs text-center py-4 mb-2.5" data-i18n="masterDB.troubleItemsEmpty">トラブル項目がまだありません</p>
                        <button type="button" onclick="addTroubleItemRow()" class="w-full py-2 px-3.5 border border-dashed border-indigo-300 hover:border-indigo-400 bg-indigo-50/40 hover:bg-indigo-50/80 text-indigo-700 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 transition cursor-pointer shadow-2xs">
                            <i class="ri-add-line text-sm"></i><span data-i18n="masterDB.addTroubleItem">トラブル項目を追加</span>
                        </button>
                    </div>

                    <!-- Tablet Tagging / Assignment -->
                    <div class="border-t border-gray-100 pt-4">
                        <div class="flex items-center justify-between mb-2.5">
                            <div>
                                <label class="block text-xs font-semibold text-gray-700" data-i18n="masterDB.troubleTabletTaggingLabel">対象タブレットのタグ付け</label>
                                <p class="text-xs text-gray-400" data-i18n="masterDB.troubleTabletTaggingSubtitle">選択したタブレットにこのトラブルグループが適用されます</p>
                            </div>
                            <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-indigo-50 text-indigo-700 text-xs font-semibold border border-indigo-100 flex-shrink-0">
                                <i class="ri-tablet-line text-xs"></i>
                                <span><span data-i18n="masterDB.troubleSelectedCountPrefix">選択中: </span><strong id="troubleTabletSelectedCount" class="font-bold tabular-nums">0</strong><span data-i18n="masterDB.troubleSelectedCountSuffix"> 台</span></span>
                            </div>
                        </div>

                        <!-- Action Toolbar: Search & Selection Buttons -->
                        <div class="flex items-center justify-between gap-2.5 mb-2.5">
                            <div class="relative flex-1">
                                <i class="ri-search-line absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs pointer-events-none"></i>
                                <input type="text" id="troubleTabletSearch" oninput="filterTroubleTablets(this.value)" data-i18n-placeholder="masterDB.troubleTabletSearchPlaceholder" placeholder="タブレット名・ラインで検索..." class="w-full pl-8 pr-3 py-1.5 text-xs border border-gray-200 rounded-xl bg-white focus:border-indigo-500 focus:outline-none placeholder:text-gray-400 shadow-2xs" />
                            </div>
                            <div class="flex items-center gap-2 flex-shrink-0">
                                <button type="button" id="troubleTabletSelectAllBtn" onclick="selectAllTroubleTablets(true)" class="inline-flex items-center gap-1.5 text-xs font-semibold text-indigo-700 bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-xl border border-indigo-200 transition cursor-pointer whitespace-nowrap shadow-2xs">
                                    <i class="ri-checkbox-line text-xs"></i><span data-i18n="masterDB.selectAll">全選択</span>
                                </button>
                                <button type="button" id="troubleTabletUnselectAllBtn" onclick="selectAllTroubleTablets(false)" class="inline-flex items-center gap-1.5 text-xs font-semibold text-gray-600 bg-white hover:bg-gray-50 px-3 py-1.5 rounded-xl border border-gray-200 transition cursor-pointer whitespace-nowrap shadow-2xs hidden">
                                    <i class="ri-checkbox-blank-line text-xs"></i><span data-i18n="masterDB.clearAll">全解除</span>
                                </button>
                            </div>
                        </div>

                        <div id="troubleTabletsContainer" class="max-h-48 overflow-y-auto p-2 bg-gray-50/80 rounded-xl border border-gray-100 grid grid-cols-2 gap-2 text-xs">
                            <!-- tablets checkboxes injected by JS -->
                        </div>
                    </div>
                </div>
                <div class="flex justify-end gap-2 px-6 py-3 border-t border-gray-100 bg-gray-50/50 flex-shrink-0">
                    <button onclick="closeTroubleGroupModal()" class="rounded-xl border border-gray-200 bg-white px-3.5 py-1.5 text-xs font-medium text-gray-700 shadow-2xs hover:bg-gray-50 transition cursor-pointer" data-i18n="common.cancel">キャンセル</button>
                    <button onclick="saveTroubleGroup()" class="inline-flex items-center gap-1.5 rounded-xl bg-emerald-600 px-3.5 py-1.5 text-xs font-semibold text-white shadow-2xs hover:bg-emerald-700 transition cursor-pointer">
                        <i class="ri-save-line"></i><span data-i18n="common.save">保存</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Quick Create Modal -->
        <div id="quickCreateModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs hidden z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-2xl border border-gray-100 max-w-3xl w-full max-h-[90vh] overflow-hidden">
                <div class="px-6 py-3.5 border-b border-gray-100 flex items-center justify-between">
                    <h3 class="text-base font-semibold text-gray-900 flex items-center gap-2">
                        <i class="ri-add-line text-emerald-600 text-lg"></i><span data-i18n="masterDB.newRegistration">新規登録</span>
                    </h3>
                    <button onclick="closeQuickCreateModal()" class="flex h-7 w-7 items-center justify-center rounded-lg text-gray-400 hover:bg-gray-100 hover:text-gray-700 transition cursor-pointer">
                        <i class="ri-close-line text-lg"></i>
                    </button>
                </div>
                <div class="p-6 overflow-y-auto" style="max-height: calc(90vh - 150px);">
                    <div class="grid grid-cols-2 gap-4">
                        <!-- Content dynamically populated by masterDB.js -->
                    </div>
                </div>
                <div class="flex justify-end gap-2 px-6 py-3 border-t border-gray-100 bg-gray-50/50">
                    <button onclick="closeQuickCreateModal()" class="rounded-xl border border-gray-200 bg-white px-3.5 py-1.5 text-xs font-medium text-gray-700 shadow-2xs hover:bg-gray-50 transition cursor-pointer">
                        <span data-i18n="common.cancel">キャンセル</span>
                    </button>
                    <button onclick="submitQuickCreate()" class="inline-flex items-center gap-1.5 rounded-xl bg-emerald-600 px-3.5 py-1.5 text-xs font-semibold text-white shadow-2xs hover:bg-emerald-700 transition cursor-pointer">
                        <i class="ri-check-line"></i><span data-i18n="common.register">登録</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Apply translations to all data-i18n elements in masterDB
        function applyMasterDBTranslations() {
            if (typeof t !== 'function') return;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (key) el.textContent = t(key);
            });
        }
        // Apply on load
        applyMasterDBTranslations();
        // Re-apply on language change
        window.addEventListener('languageChanged', () => { applyMasterDBTranslations(); });
    </script>
    <script src="js/masterDB.js"></script>
</body>
</html>
