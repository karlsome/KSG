<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPC Management - KSG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet" />
    <!-- Universal Fonts & Admin Theme -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin-theme.css">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body class="bg-gray-50 font-sans antialiased text-gray-900">
    <div class="container mx-auto px-4 py-6">
        <!-- Header with Title and Status -->
        <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between mb-5">
            <div>
                <h1 id="opcManagementTitle" class="text-2xl font-semibold tracking-tight text-gray-900" data-i18n="opcManagement.title">OPC Management</h1>
                <p class="mt-0.5 text-xs text-gray-500">OPC-UA データポイントのリアルタイム監視・型変換・変数結合設定</p>
            </div>
            <div class="flex items-center gap-3">
                <span id="opc-connection-status" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-gray-100 text-gray-600 text-xs font-medium border border-gray-200/60 shadow-2xs">
                    <span class="w-2 h-2 rounded-full bg-gray-400"></span>
                    <span class="text-xs font-semibold" data-i18n="opcManagement.disconnected"></span>
                </span>
            </div>
        </div>

        <!-- Raspberry Pi Filter -->
        <div class="bg-white rounded-2xl shadow-xs border border-gray-100 p-4 mb-5">
            <div class="flex flex-wrap items-center gap-3">
                <label class="text-xs font-semibold text-gray-700 flex items-center gap-1.5" data-i18n="opcManagement.raspberryPi">
                    <i class="ri-cpu-line text-indigo-600 text-sm"></i> Raspberry Pi
                </label>
                <select id="opc-raspberry-filter" class="flex-1 max-w-md rounded-xl border border-gray-200 bg-white px-3.5 py-2 text-xs font-medium text-gray-800 shadow-2xs transition focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                    <option value="" data-i18n="opcManagement.selectRaspberryPi"></option>
                </select>
            </div>
        </div>

        <!-- Main Layout: Two Panels -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-5 items-start">
            <!-- Left Panel: Real-time Data -->
            <div class="bg-white rounded-2xl shadow-xs border border-gray-100 overflow-hidden flex flex-col">
                <div class="border-b border-gray-100 px-4 py-3 bg-gray-50/50 flex justify-between items-center">
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 rounded-full bg-blue-500"></div>
                        <h2 class="text-xs font-semibold uppercase tracking-wider text-gray-700" data-i18n="opcManagement.realTimeData">リアルタイムデータ</h2>
                    </div>
                    <button id="refresh-data-btn" class="inline-flex items-center gap-1.5 rounded-xl border border-gray-200 bg-white px-3 py-1.5 text-xs font-semibold text-gray-700 shadow-2xs transition hover:bg-gray-50 hover:text-gray-900 cursor-pointer">
                        <i class="ri-scan-2-line text-blue-600"></i> <span data-i18n="opcManagement.scanNodes">Scan Nodes</span>
                    </button>
                </div>
                <div>
                    <div id="opc-raw-data-container">
                        <div class="text-center py-12 text-gray-500">
                            <i class="ri-inbox-line text-4xl mb-3 text-gray-400"></i>
                            <p class="text-sm font-medium text-gray-600" data-i18n="opcManagement.selectDeviceToView"></p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Variables -->
            <div class="bg-white rounded-2xl shadow-xs border border-gray-100 overflow-hidden flex flex-col">
                <div class="border-b border-gray-100 px-4 py-3 bg-gray-50/50 flex justify-between items-center">
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 rounded-full bg-emerald-500"></div>
                        <h2 class="text-xs font-semibold uppercase tracking-wider text-gray-700" data-i18n="opcManagement.variables">登録変数</h2>
                    </div>
                    <button onclick="openCombinedVariableModal()" class="inline-flex items-center gap-1.5 rounded-xl bg-emerald-600 px-3.5 py-1.5 text-xs font-semibold text-white shadow-2xs transition hover:bg-emerald-700 cursor-pointer">
                        <i class="ri-add-line"></i> <span data-i18n="opcManagement.combine">変数結合</span>
                    </button>
                </div>
                <div>
                    <div id="opc-variables-container">
                        <div class="text-center py-12 text-gray-500">
                            <i class="ri-price-tag-3-line text-4xl mb-3 text-gray-400"></i>
                            <p class="text-sm font-medium text-gray-600" data-i18n="opcManagement.noVariablesCreated"></p>
                            <p class="text-xs text-gray-400 mt-1" data-i18n="opcManagement.clickDataToCreate"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Conversion Modal -->
    <div id="opc-conversion-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-[2px] z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-xl w-full max-h-[90vh] overflow-hidden flex flex-col border border-gray-100">
            <div class="border-b border-gray-100 px-5 py-3.5 flex justify-between items-center bg-gray-50/50">
                <h3 class="text-sm font-bold text-gray-900 flex items-center gap-2" data-i18n-prefix="opcManagement.createVariable" data-i18n-icon="1"></h3>
                <button onclick="closeOPCModal('opc-conversion-modal')" class="text-gray-400 hover:text-gray-600 transition p-1 rounded-lg hover:bg-gray-100">
                    <i class="ri-close-line text-lg"></i>
                </button>
            </div>
            <div class="p-5 space-y-4 overflow-y-auto">
                <!-- Source Info Panel -->
                <div class="bg-slate-50 border border-slate-200/80 rounded-xl p-3.5 space-y-2">
                    <h4 class="font-semibold text-xs text-slate-700 mb-1 flex items-center gap-1.5" data-i18n="opcManagement.sourceData">
                        <i class="ri-database-2-line text-indigo-600"></i> 元データ情報
                    </h4>
                    <div class="space-y-1.5 text-xs">
                        <div class="flex justify-between items-center">
                            <span class="text-slate-500 font-medium" data-i18n="opcManagement.datapoint"></span>
                            <span id="conv-datapoint-name" class="text-slate-800 font-semibold">-</span>
                        </div>
                        <div id="conv-array-index-row" class="flex justify-between items-center" style="display: none;">
                            <span class="text-slate-500 font-medium" data-i18n="opcManagement.arrayIndex"></span>
                            <span id="conv-array-index" class="text-slate-800 font-mono font-semibold">-</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-slate-500 font-medium" data-i18n="opcManagement.rawValue"></span>
                            <span id="conv-raw-value" class="font-mono text-xs text-slate-900 font-bold bg-white px-2 py-0.5 rounded border border-slate-200/60">-</span>
                        </div>
                    </div>
                </div>

                <form id="opc-conversion-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1.5">
                            <span data-i18n="opcManagement.variableNameLabel"></span> <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="conv-variable-name" required
                            class="w-full rounded-xl border border-gray-200 bg-white px-3 py-2 text-xs font-medium text-gray-800 shadow-2xs transition focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                        <p class="mt-1 text-2xs text-gray-500" data-i18n="opcManagement.variableNameHint"></p>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1.5">
                            <span data-i18n="opcManagement.convertFrom"></span> <span class="text-red-500">*</span>
                        </label>
                        <select id="conv-from-type" required onchange="updateConversionPreview()"
                            class="w-full rounded-xl border border-gray-200 bg-white px-3 py-2 text-xs font-medium text-gray-800 shadow-2xs transition focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                            <option value="" data-i18n="opcManagement.selectSourceFormat"></option>
                            <option value="uint16" data-i18n="opcManagement.uint16"></option>
                            <option value="uint8" data-i18n="opcManagement.uint8"></option>
                            <option value="uint32" data-i18n="opcManagement.uint32"></option>
                            <option value="int16" data-i18n="opcManagement.int16"></option>
                            <option value="int8" data-i18n="opcManagement.int8"></option>
                            <option value="int32" data-i18n="opcManagement.int32"></option>
                            <option value="hex16" data-i18n="opcManagement.hex16"></option>
                            <option value="hex8" data-i18n="opcManagement.hex8"></option>
                            <option value="binary16" data-i18n="opcManagement.binary16"></option>
                            <option value="binary8" data-i18n="opcManagement.binary8"></option>
                            <option value="binary4" data-i18n="opcManagement.binary4"></option>
                            <option value="float32" data-i18n="opcManagement.float32"></option>
                            <option value="double64" data-i18n="opcManagement.double64"></option>
                            <option value="string" data-i18n="opcManagement.string"></option>
                            <option value="boolean" data-i18n="opcManagement.boolean"></option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1.5">
                            <span data-i18n="opcManagement.convertTo"></span> <span class="text-red-500">*</span>
                        </label>
                        <select id="conv-to-type" required onchange="updateConversionPreview()"
                            class="w-full rounded-xl border border-gray-200 bg-white px-3 py-2 text-xs font-medium text-gray-800 shadow-2xs transition focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                            <option value="" data-i18n="opcManagement.selectTargetFormat"></option>
                            <option value="uint16" data-i18n="opcManagement.uint16"></option>
                            <option value="uint8" data-i18n="opcManagement.uint8"></option>
                            <option value="uint32" data-i18n="opcManagement.uint32"></option>
                            <option value="int16" data-i18n="opcManagement.int16"></option>
                            <option value="int8" data-i18n="opcManagement.int8"></option>
                            <option value="int32" data-i18n="opcManagement.int32"></option>
                            <option value="hex16" data-i18n="opcManagement.hex16"></option>
                            <option value="hex8" data-i18n="opcManagement.hex8"></option>
                            <option value="binary16" data-i18n="opcManagement.binary16"></option>
                            <option value="binary8" data-i18n="opcManagement.binary8"></option>
                            <option value="binary4" data-i18n="opcManagement.binary4"></option>
                            <option value="ascii2" data-i18n="opcManagement.ascii2"></option>
                            <option value="ascii1" data-i18n="opcManagement.ascii1"></option>
                            <option value="float32" data-i18n="opcManagement.float32"></option>
                            <option value="double64" data-i18n="opcManagement.double64"></option>
                            <option value="string" data-i18n="opcManagement.string"></option>
                            <option value="none" data-i18n="opcManagement.none"></option>
                        </select>
                    </div>

                    <div id="conv-preview" class="bg-emerald-50/70 border border-emerald-200 rounded-xl p-3" style="display: none;">
                        <h4 class="font-semibold text-xs text-emerald-900 mb-1" data-i18n="opcManagement.preview">プレビュー</h4>
                        <div id="conv-preview-value" class="text-base font-mono font-bold text-emerald-700">-</div>
                    </div>

                    <div class="flex justify-end gap-2 pt-3 border-t border-gray-100">
                        <button type="button" onclick="closeOPCModal('opc-conversion-modal')"
                            class="rounded-xl border border-gray-200 bg-white px-3.5 py-1.5 text-xs font-semibold text-gray-700 shadow-2xs transition hover:bg-gray-50 cursor-pointer"
                            data-i18n="opcManagement.cancel"></button>
                        <button type="submit"
                            class="rounded-xl bg-indigo-600 px-4 py-1.5 text-xs font-semibold text-white shadow-2xs transition hover:bg-indigo-700 cursor-pointer"
                            data-i18n="opcManagement.createVariable"></button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Combine Variables Modal -->
    <div id="opc-combine-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-[2px] z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-xl w-full max-h-[90vh] overflow-hidden flex flex-col border border-gray-100">
            <div class="border-b border-gray-100 px-5 py-3.5 flex justify-between items-center bg-gray-50/50">
                <h3 class="text-sm font-bold text-gray-900 flex items-center gap-2" data-i18n-prefix="opcManagement.combineVariables" data-i18n-icon="2"></h3>
                <button onclick="closeOPCModal('opc-combine-modal')" class="text-gray-400 hover:text-gray-600 transition p-1 rounded-lg hover:bg-gray-100">
                    <i class="ri-close-line text-lg"></i>
                </button>
            </div>
            <div class="p-5 space-y-4 overflow-y-auto">
                <form id="opc-combine-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1.5">
                            <span data-i18n="opcManagement.combinedVariableName"></span> <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="combine-variable-name" required
                            class="w-full rounded-xl border border-gray-200 bg-white px-3 py-2 text-xs font-medium text-gray-800 shadow-2xs transition focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1.5">
                            <span data-i18n="opcManagement.selectVariablesToCombine"></span> <span class="text-red-500">*</span>
                        </label>
                        <div id="combine-selected-vars" class="flex flex-wrap gap-1.5 p-2.5 border border-gray-200 bg-gray-50/50 rounded-xl mb-2 min-h-[48px] items-center">
                            <span class="text-gray-400 text-xs" data-i18n="opcManagement.noVariablesSelected"></span>
                        </div>
                        <select id="combine-variable-select" onchange="addVariableToCombine()"
                            class="w-full rounded-xl border border-gray-200 bg-white px-3 py-2 text-xs font-medium text-gray-800 shadow-2xs transition focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                            <option value="" data-i18n="opcManagement.addVariable"></option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1.5">
                            <span data-i18n="opcManagement.operation"></span> <span class="text-red-500">*</span>
                        </label>
                        <select id="combine-operation" required onchange="updateCombinePreview()"
                            class="w-full rounded-xl border border-gray-200 bg-white px-3 py-2 text-xs font-medium text-gray-800 shadow-2xs transition focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                            <option value="concatenate" data-i18n="opcManagement.concatenate"></option>
                            <option value="add" data-i18n="opcManagement.add"></option>
                            <option value="subtract" data-i18n="opcManagement.subtract"></option>
                            <option value="multiply" data-i18n="opcManagement.multiply"></option>
                            <option value="divide" data-i18n="opcManagement.divide"></option>
                            <option value="average" data-i18n="opcManagement.average"></option>
                        </select>
                    </div>

                    <div id="combine-preview" class="bg-purple-50/70 border border-purple-200 rounded-xl p-3" style="display: none;">
                        <h4 class="font-semibold text-xs text-purple-900 mb-1" data-i18n="opcManagement.previewResult"></h4>
                        <div id="combine-preview-value" class="text-base font-mono font-bold text-purple-700">-</div>
                    </div>

                    <div class="flex justify-end gap-2 pt-3 border-t border-gray-100">
                        <button type="button" onclick="closeOPCModal('opc-combine-modal')"
                            class="rounded-xl border border-gray-200 bg-white px-3.5 py-1.5 text-xs font-semibold text-gray-700 shadow-2xs transition hover:bg-gray-50 cursor-pointer"
                            data-i18n="opcManagement.cancel"></button>
                        <button type="submit"
                            class="rounded-xl bg-emerald-600 px-4 py-1.5 text-xs font-semibold text-white shadow-2xs transition hover:bg-emerald-700 cursor-pointer"
                            data-i18n="opcManagement.createCombinedVariable"></button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Edit Variable Modal -->
    <div id="opc-edit-variable-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-[2px] z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-xl w-full max-h-[90vh] overflow-hidden flex flex-col border border-gray-100">
            <div class="border-b border-gray-100 px-5 py-3.5 flex justify-between items-center bg-gray-50/50">
                <h3 class="text-sm font-bold text-gray-900 flex items-center gap-2" data-i18n-prefix="opcManagement.editVariable" data-i18n-icon="3"></h3>
                <button onclick="closeOPCModal('opc-edit-variable-modal')" class="text-gray-400 hover:text-gray-600 transition p-1 rounded-lg hover:bg-gray-100">
                    <i class="ri-close-line text-lg"></i>
                </button>
            </div>
            <div class="p-5 space-y-4 overflow-y-auto">
                <form id="opc-edit-variable-form" class="space-y-4">
                    <input type="hidden" id="edit-variable-id">

                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1.5">
                            <span data-i18n="opcManagement.variableNameLabel"></span> <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="edit-variable-name" required
                            class="w-full rounded-xl border border-gray-200 bg-white px-3 py-2 text-xs font-medium text-gray-800 shadow-2xs transition focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                        <p class="mt-1 text-2xs text-gray-500" data-i18n="opcManagement.variableNameHint"></p>
                    </div>

                    <!-- Source variables and operation fields (only for combined variables) -->
                    <div id="edit-operation-field" style="display: none;">
                        <div class="mb-3">
                            <label class="block text-xs font-semibold text-gray-700 mb-1.5">
                                <span data-i18n="opcManagement.sourceVariables"></span> <span class="text-red-500">*</span>
                            </label>
                            <div id="edit-source-variables" class="border border-gray-200 rounded-xl p-2.5 bg-gray-50/50 min-h-[48px] mb-2 flex flex-wrap gap-1.5 items-center">
                                <!-- Source variables will be populated here -->
                            </div>
                            <select id="edit-add-variable-select" onchange="addVariableToEdit()"
                                class="w-full rounded-xl border border-gray-200 bg-white px-3 py-2 text-xs font-medium text-gray-800 shadow-2xs transition focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                                <option value="" data-i18n="opcManagement.addVariable"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="block text-xs font-semibold text-gray-700 mb-1.5">
                                <span data-i18n="opcManagement.operation"></span> <span class="text-red-500">*</span>
                            </label>
                            <select id="edit-operation" onchange="updateEditCombinedPreview()"
                                class="w-full rounded-xl border border-gray-200 bg-white px-3 py-2 text-xs font-medium text-gray-800 shadow-2xs transition focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                                <option value="">Select operation...</option>
                                <option value="concatenate" data-i18n="opcManagement.concatenateJoin"></option>
                                <option value="add" data-i18n="opcManagement.add"></option>
                                <option value="subtract" data-i18n="opcManagement.subtract"></option>
                                <option value="multiply" data-i18n="opcManagement.multiply"></option>
                                <option value="divide" data-i18n="opcManagement.divide"></option>
                                <option value="average" data-i18n="opcManagement.average"></option>
                            </select>
                        </div>

                        <div id="edit-combined-preview" class="bg-emerald-50/70 border border-emerald-200 rounded-xl p-3" style="display: none;">
                            <h4 class="font-semibold text-xs text-emerald-900 mb-1" data-i18n="opcManagement.preview"></h4>
                            <div id="edit-combined-preview-value" class="text-base font-mono font-bold text-emerald-700">-</div>
                        </div>
                    </div>

                    <div id="edit-conversion-fields">
                        <!-- Source Information -->
                        <div class="bg-slate-50 border border-slate-200/80 rounded-xl p-3.5 mb-3">
                            <h4 class="font-semibold text-xs text-slate-700 mb-2 flex items-center gap-1.5">
                                <i class="ri-information-line text-indigo-600"></i><span data-i18n="opcManagement.sourceDataInfo"></span>
                            </h4>
                            <div class="grid grid-cols-2 gap-3 text-xs">
                                <div>
                                    <span class="font-medium text-slate-500" data-i18n="opcManagement.nodeId"></span>
                                    <div id="edit-source-node-id" class="font-mono text-slate-800 bg-white px-2 py-1 rounded-lg border border-slate-200/60 mt-1">-</div>
                                </div>
                                <div>
                                    <span class="font-medium text-slate-500" data-i18n="opcManagement.currentRawValue"></span>
                                    <div id="edit-source-raw-value" class="font-mono text-slate-800 bg-white px-2 py-1 rounded-lg border border-slate-200/60 mt-1">-</div>
                                </div>
                                <div>
                                    <span class="font-medium text-slate-500" data-i18n="opcManagement.sourceType"></span>
                                    <div id="edit-source-type" class="text-slate-800 mt-1 font-medium">-</div>
                                </div>
                                <div>
                                    <span class="font-medium text-slate-500" data-i18n="opcManagement.arrayIndex"></span>
                                    <div id="edit-array-index" class="text-slate-800 mt-1 font-mono font-medium">-</div>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="block text-xs font-semibold text-gray-700 mb-1.5">
                                <span data-i18n="opcManagement.convertFrom"></span> <span class="text-red-500">*</span>
                            </label>
                            <select id="edit-conv-from-type" required onchange="updateEditConversionPreview()"
                                class="w-full rounded-xl border border-gray-200 bg-white px-3 py-2 text-xs font-medium text-gray-800 shadow-2xs transition focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500">
                                <option value="" data-i18n="opcManagement.selectSourceFormat"></option>
                                <option value="uint16" data-i18n="opcManagement.uint16"></option>
                                <option value="uint8" data-i18n="opcManagement.uint8"></option>

    <script src="js/config.js"></script>
    <script src="js/languages.js"></script>
    <script>
        // Apply translations to all data-i18n elements
        function applyOPCTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (key && typeof t === 'function') {
                    el.textContent = t(key);
                }
            });
            // Special: title with icon prefix
            const icons = { '1': '🔄 ', '2': '🔗 ', '3': '✏️ ' };
            document.querySelectorAll('[data-i18n-prefix]').forEach(el => {
                const key = el.getAttribute('data-i18n-prefix');
                const iconType = el.getAttribute('data-i18n-icon');
                if (key && typeof t === 'function') {
                    el.textContent = (icons[iconType] || '') + t(key);
                }
            });
            // Set placeholder for variable name input
            const convVarName = document.getElementById('conv-variable-name');
            if (convVarName) convVarName.placeholder = t('opcManagement.variableNamePlaceholder');
            const combineVarName = document.getElementById('combine-variable-name');
            if (combineVarName) combineVarName.placeholder = t('opcManagement.combinedVariablePlaceholder');
            // Set title without emoji
            const titleEl = document.getElementById('opcManagementTitle');
            if (titleEl) titleEl.textContent = t('opcManagement.title');
        }
        // Apply on DOM load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                if (typeof t === 'function') applyOPCTranslations();
            });
        } else {
            // DOM already loaded
            if (typeof t === 'function') applyOPCTranslations();
        }
        // Re-apply on language change
        window.addEventListener('languageChanged', () => { applyOPCTranslations(); });
    </script>
    <script src="js/opcManagement.js"></script>
</body>
