<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KSG 管理ログイン</title>
  <!-- Login for the admin site that stays on this host (e.g. http://localhost:3000).
       Production users normally log in at https://www.freyaaccess.com/ instead.
       The server it talks to is API_URL from js/config.js. -->
  <script src="/js/config.js"></script>
  <style>
    :root { --bg: #f1f5f9; --card: #ffffff; --ink: #1e293b; --muted: #64748b; --line: #cbd5e1; --brand: #1e3a5f; --err: #b91c1c; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
           font: 15px/1.5 -apple-system, "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif; padding: 16px; }
    form { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 28px; }
    h1 { margin: 0 0 4px; font-size: 20px; color: var(--brand); }
    p.sub { margin: 0 0 20px; color: var(--muted); font-size: 13px; word-break: break-all; }
    label { display: block; font-size: 13px; margin: 12px 0 4px; }
    input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font-size: 15px; }
    button { width: 100%; margin-top: 20px; padding: 11px; border: 0; border-radius: 8px; background: var(--brand); color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .err { color: var(--err); font-size: 13px; margin-top: 12px; min-height: 1em; }
  </style>
</head>
<body>
  <form id="f">
    <h1>KSG 管理ログイン</h1>
    <p class="sub" id="server"></p>
    <label for="u">ユーザー名 / Username</label>
    <input id="u" autocomplete="username" required>
    <label for="p">パスワード / Password</label>
    <input id="p" type="password" autocomplete="current-password" required>
    <button id="b" type="submit">ログイン / Log in</button>
    <div class="err" id="e" role="alert"></div>
  </form>
  <script>
    const api = (typeof API_URL !== 'undefined' && API_URL) ? API_URL.replace(/\/$/, '') : location.origin;
    document.getElementById('server').textContent = 'Server: ' + api;
    document.getElementById('f').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const btn = document.getElementById('b'), err = document.getElementById('e');
      btn.disabled = true; err.textContent = '';
      try {
        const res = await fetch(api + '/loginCustomer', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: document.getElementById('u').value.trim(), password: document.getElementById('p').value }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.token) throw new Error(data.error || 'Login failed');
        const payload = JSON.parse(decodeURIComponent(escape(atob(data.token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')))));
        localStorage.setItem('ksgToken', data.token);
        localStorage.setItem('authUser', JSON.stringify(payload));
        location.href = '/';
      } catch (e) {
        err.textContent = e.message;
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
